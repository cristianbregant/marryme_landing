name: marryme_landing
description: Landing page di MarryMe, l'invito digitale per il matrimonio.
version: 1.0.0

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.23.5
  jaspr_lucide: ^0.55.0
  jaspr_router: ^0.9.0

dev_dependencies:
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.5
  jaspr_builder: ^0.23.5
  lints: ^5.0.0

jaspr:
  mode: static
  # diversa da API (8080) e pannello (8081), anche per la generazione statica
  port: 8082
