name: marryme_landing
description: Landing page di MarryMe, l'invito digitale per il matrimonio.
version: 1.0.0

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.23.5
  jaspr_lucide: ^0.55.0
  jaspr_router: ^0.9.0

dev_dependencies:
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.5
  jaspr_builder: ^0.23.5
  lints: ^5.0.0

jaspr:
  mode: static
  # diversa da API (8080) e pannello (8081), anche per la generazione statica
  port: 8082

# Con Dart 3.14 (Flutter 3.50) jaspr 0.23 non si risolve: jaspr_builder 0.23.5
# vuole analyzer 12, che c'è solo fino a build_web_compilers 4.8.5, e quella
# dichiara Dart < 3.14. Si forza la 4.8.5 (build provata identica a quella
# fatta con Dart 3.13). Da togliere con jaspr 0.24 stabile.
dependency_overrides:
  build_web_compilers: 4.8.5
